[defaults]
# Inventory file location
inventory = ./inventory

# Disable host key checking for SSH connections
host_key_checking = False

# Python interpreter for Ansible
interpreter_python = auto_silent

[privilege_escalation]
# Enable privilege escalation by default
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH timeout in seconds
timeout = 10

# Enable pipelining for better performance
pipelining = True
